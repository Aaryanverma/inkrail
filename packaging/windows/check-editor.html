<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="./ui/shell.css">
<link rel="stylesheet" href="./ui/desk.css">
<link rel="stylesheet" href="./ui/editor.css">
<div id="surface" style="position:relative;width:700px;height:500px"></div>
<pre id="result">Pending</pre>
<script type="module">
import { mountEditor } from "./ui/editor.js";
import { mountDesk } from "./ui/desk.js";
import * as markdown from "./ui/markdown.js";
import { Keys, sampleURL } from "./ui/audio.js";
import { choices, mountPanels, normalizeSettings } from "./ui/panels.js";

const { exportMarkdown, exportPlainText, importMarkdown } = markdown;
const result = document.querySelector("#result");
function expect(condition, message) {
    if (!condition) throw new Error(message);
}
try {
    // Older portable archives are still supported by the Store repackaging workflow.
    if (new URLSearchParams(location.search).has('interactive')) {
        const {makeInteractiveLetter} = await import('./ui/interactive-letter.js');
        const page = {privateTitle: 'personal filing label 728', ...importMarkdown('# Hello\n\nDear **Zoë**,')};
        page.text += '\n\n<sample> & __INKRAIL_BODY__\n##  ';
        const seal = {text: '</script' + '> & ✉️', shape: 'oval', color: 'navy'};
        const html = await makeInteractiveLetter(page, normalizeSettings({paper: 'cream'}), seal);
        const exported = new DOMParser().parseFromString(html, 'text/html');
        const body = exported.getElementById('letter-body');
        const settings = JSON.parse(exported.querySelector('script[type="application/json"]').textContent);
        const audio = exported.querySelector('script#paper-rustle[type="application/octet-stream"]');
        const recording = await fetch('./ui/assets/paper-unfold.mp3');
        expect(audio && recording.ok, 'Interactive export is missing its paper recording.');
        const embedded = atob(audio.textContent.trim());
        const bytes = new Uint8Array(await recording.arrayBuffer());
        expect(bytes.length > 0 && bytes.length === embedded.length && bytes.every((byte, i) => embedded.charCodeAt(i) === byte),
            'Interactive export changed or truncated the packaged paper recording.');
        expect(body.querySelector('h1')?.textContent === 'Hello' && body.querySelector('strong')?.textContent === 'Zoë',
            'Interactive letter lost its heading or inline emphasis.');
        expect(body.textContent.includes('<sample> & __INKRAIL_BODY__') && !body.querySelector('sample'),
            'Interactive letter treated writing as markup or a template slot.');
        expect(body.textContent.includes('##  '), 'Interactive letter dropped a literal heading marker.');
        expect(settings.seal.text === seal.text && settings.seal.color === 'navy' && settings.paper === 'cream',
            'Interactive letter lost seal or paper settings.');
        expect(html.includes('&lt;/script&gt; &amp; ✉️'), 'Script-free preview lost its escaped seal inscription.');
        expect(!html.includes(page.privateTitle) && html.includes('data:image/png;base64,') &&
            !html.includes('__INKRAIL_GRAIN__') && !html.includes('__INKRAIL_WAX__'), 'Interactive export has incomplete artwork or private metadata.');
        if (new URLSearchParams(location.search).has('protected')) {
            const passphrase = '  Déjà-vu ✉️  ';
            const locked = await makeInteractiveLetter(page, normalizeSettings({paper: 'cream'}), seal, passphrase);
            expect(!locked.includes(page.privateTitle) && !locked.includes('Zoë') && !locked.includes(passphrase) &&
                !locked.includes('data:image/png;base64,'), 'Protected export disclosed letter data.');
            const wrapper = new DOMParser().parseFromString(locked, 'text/html');
            const data = JSON.parse(wrapper.querySelector('script[type="application/json"]').textContent);
            const bytes = value => Uint8Array.from(atob(value), ch => ch.charCodeAt(0));
            expect(data.version === 1 && bytes(data.iv).length === 12 && bytes(data.salt).length === 16, 'Invalid encrypted letter header.');
            const input = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
            const key = await crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt:bytes(data.salt), iterations:600000},
                input, {name:'AES-GCM', length:256}, false, ['decrypt']);
            const cipher = bytes(data.ciphertext);
            const algorithm = {name:'AES-GCM', iv:bytes(data.iv), tagLength:128};
            const plain = await crypto.subtle.decrypt(algorithm, key, cipher);
            expect(new TextDecoder().decode(plain) === html, 'Protected export changed the rendered letter.');
            cipher[cipher.length - 1] ^= 1;
            const authenticated = await crypto.subtle.decrypt(algorithm, key, cipher).then(() => true, () => false);
            expect(!authenticated, 'A modified letter passed authentication.');
        }
    }
    const initial = {id: "test", text: "Selected writing", formatting: [{location: 0, length: 8, emphasis: 2}]};
    const edits = [];
    const surface = document.querySelector("#surface");
    const strokes = [];
    const editor = mountEditor(surface, {onChange: page => edits.push(page), onSound: kind => strokes.push(kind)});
    // The MSIX workflow also checks older release archives with this fixture.
    const supportsSeals = typeof editor.setSeal === "function" || typeof exportPlainText === "function";
    if (supportsSeals) {
        const panelRoot = document.createElement('div');
        document.body.append(panelRoot);
        const panels = mountPanels(panelRoot, {onAction(action, id, value) {
            expect(action === 'setSeal' && id === initial.id, 'Seal targeted the wrong letter.');
            editor.setSeal(value, true);
            return true;
        }});
        editor.load(initial);
        for (const cancel of [true, false]) {
            panels.showSeal(editor.snapshot());
            const dialog = panelRoot.querySelector('dialog[open]');
            const input = dialog.querySelector('input'), [shape, color] = dialog.querySelectorAll('select');
            input.value = '  ';
            input.dispatchEvent(new Event('input'));
            expect(dialog.querySelector('[type=submit]').disabled, 'Blank seal inscription was accepted.');
            input.value = '✍️'.repeat(25);
            input.dispatchEvent(new Event('input'));
            expect(input.value === '✍️'.repeat(24), 'Seal limit split composed characters.');
            input.value = '  A & <B>  ';
            input.dispatchEvent(new Event('input'));
            shape.value = 'scalloped'; color.value = 'plum';
            for (const control of [shape, color]) control.dispatchEvent(new Event('change'));
            expect(dialog.querySelector('.ink-seal').dataset.color === 'plum', 'Seal preview did not change color.');
            if (cancel) {
                panels.close();
                expect(!editor.snapshot().seal, 'Cancel applied a seal.');
            } else {
                dialog.querySelector('[type=submit]').click();
                await Promise.resolve(); await Promise.resolve();
                const sealed = editor.snapshot(), footer = surface.querySelector('.ink-seal-footer');
                expect(sealed.seal.text === 'A & <B>' && sealed.seal.color === 'plum' && sealed.seal.shape === 'scalloped', 'Lost seal customization.');
                expect(sealed.text === initial.text && !editor.element.contains(footer), 'Seal leaked into editable text.');
                expect(footer.getBoundingClientRect().top >= editor.element.lastElementChild.getBoundingClientRect().bottom - 1, 'Seal overlaps final line.');
                editor.load({text:'Another letter'});
                expect(footer.hidden, 'Seal followed the writer onto another letter.');
                editor.load(sealed);
                expect(!footer.hidden && footer.textContent === 'A & <B>', 'Saved seal did not reopen.');
                panels.showSeal(sealed);
                panelRoot.querySelector('.ip-remove-seal').click();
                await Promise.resolve(); await Promise.resolve();
                expect(footer.hidden && !editor.snapshot().seal, 'Remove did not clear the saved seal.');
            }
        }
        panels.destroy(); panelRoot.remove();
    }
    function paste(type, data) {
        editor.load(initial);
        editor.focus();
        const range = document.createRange();
        range.selectNodeContents(editor.element);
        getSelection().removeAllRanges();
        getSelection().addRange(range);
        const clipboard = new DataTransfer();
        if (type === "Files") clipboard.items.add(new File(["x"], "image.png", {type: "image/png"}));
        else clipboard.setData(type, data);
        const event = new ClipboardEvent("paste", {bubbles: true, cancelable: true, clipboardData: clipboard});
        editor.element.dispatchEvent(event);
        expect(event.defaultPrevented, "Browser applied an additional native paste.");
        return editor.snapshot();
    }
    for (const [type, data] of [["Files"], ["text/html", "<img alt=''>"], ["text/plain", ""], ["application/x-inkrail-selection", "{}"]]) {
        const page = paste(type, data);
        expect(page.text === initial.text && JSON.stringify(page.formatting) === JSON.stringify(initial.formatting), "Unsupported paste changed the letter.");
        expect(edits.length === 0 && getSelection().toString() === initial.text, "Unsupported paste changed the selection or autosave state.");
    }
    expect(paste("text/plain", "  ").text === "  ", "Lost valid whitespace.");
    const html = paste("text/html", "<b>rich</b>");
    expect(html.text === "rich" && html.formatting[0].emphasis === 1, "Lost formatted HTML.");
    const own = paste("application/x-inkrail-selection", JSON.stringify(initial));
    expect(own.text === initial.text && own.formatting[0].emphasis === 2, "Lost Inkrail clipboard formatting.");
    const bold = {text: "Mum types 4*", formatting: [{location: 0, length: 12, emphasis: 1}]};
    expect(JSON.stringify(importMarkdown(exportMarkdown(bold))) === JSON.stringify(bold), "Markdown round trip changed literal asterisk.");
    if (supportsSeals) {
        const sealed = {text: "Love,\r\n", formatting: [{location: 0, length: 4, emphasis: 2}],
            seal: {text: "A < B & 👩🏽‍🎨 **", shape: "scalloped", color: "plum"}};
        const footer = '<p data-inkrail-seal="scalloped plum">✦ A &lt; B &amp; 👩🏽‍🎨 ** ✦</p>';
        expect(exportPlainText(sealed) === "Love,\r\n\n\n✦ A < B & 👩🏽‍🎨 ** ✦", "Lost literal seal text in text export.");
        expect(exportMarkdown(sealed) === "*Love*,\r\n\n\n" + footer, "Invalid seal markup in Markdown export.");
        const imported = importMarkdown(exportMarkdown(sealed));
        expect(imported.seal?.text === sealed.seal.text && imported.seal.shape === "scalloped" && imported.seal.color === "plum" &&
            imported.text === sealed.text && JSON.stringify(imported.formatting) === JSON.stringify(sealed.formatting), "Sealed letter round trip failed.");
        const invalid = "Dear reader,\n\n" + footer.replace("scalloped", "unknown").replace("👩🏽‍🎨 **", "**reader**");
        expect(!importMarkdown(invalid).seal && importMarkdown(invalid).text === invalid, "Unknown seal markup was removed.");
        const example = "~~~~html\nA literal seal footer\n\n" + footer;
        expect(!importMarkdown(example).seal && importMarkdown(example).text === example, "Code example was mistaken for a seal.");
        const sealedExample = {text: example, seal: {...sealed.seal, text: "&lt; © &amp;"}};
        const importedExample = importMarkdown(exportMarkdown(sealedExample));
        expect(importedExample.text === example && importedExample.seal?.text === "&lt; © &amp;", "Lost literal fence or entities.");

        const mark = surface.querySelector(".ink-seal-footer");
        if (typeof editor.printContent === "function") {
            const deskRoot = document.createElement("div");
            const printRoot = document.createElement("div");
            printRoot.id = "letter-print";
            document.body.append(deskRoot, printRoot);
            const desk = mountDesk(deskRoot, {width: 700, height: 550});
            try {
                for (const paperMotion of ["sheet", "roll"]) {
                    desk.update(normalizeSettings({curvedPaper: true, paperMotion, paperTexture: "laid", garden: true, paperEmbossing: "makerMark"}));
                    const {substrate, ornaments} = await desk.printPaper();
                    printRoot.replaceChildren(substrate, ornaments);
                    expect(getComputedStyle(deskRoot.querySelector(".ink-desk__substrate")).clipPath !== "none",
                        "The writing desk lost its curved paper.");
                    const grain = substrate.querySelector(".ink-desk__grain");
                    expect(grain && [substrate, grain, ornaments].every(layer => getComputedStyle(layer).clipPath === "none") &&
                        !substrate.querySelector(".ink-desk__curl, .ink-desk__lip"), "The PDF inherited the desk's curved edges.");
                    expect(ornaments.querySelector(".ink-desk__margin-art, .ink-desk__garden") && ornaments.querySelector(".ink-desk__emboss"),
                        "Flattening the printed paper removed its decoration.");
                }
                if (choices.marginStyle) {
                    expect(normalizeSettings({garden: true}).marginStyle === "botanical" &&
                        normalizeSettings({garden: false}).marginStyle === "none" &&
                        normalizeSettings({marginStyle: "none", garden: true}).marginStyle === "none" &&
                        normalizeSettings({marginStyle: "unknown"}).marginStyle === "none", "Margin preference migration failed.");
                    const liveMotifs = new Set(), printMotifs = new Set();
                    for (const style of ["botanical", "ledger", "artDeco", "celestial", "none"]) {
                        desk.update(normalizeSettings({marginStyle: style, garden: true, paperTexture: "smooth"}));
                        const live = deskRoot.querySelector(".ink-desk__margin-art");
                        const {ornaments} = await desk.printPaper();
                        const printed = ornaments.querySelector(".ink-desk__margin-art");
                        if (style === "none") {
                            expect(!live.childElementCount && !printed, "Turning the margin off left an ornament.");
                        } else {
                            expect(live.childElementCount && printed?.childElementCount, "Missing " + style + " margin.");
                            liveMotifs.add(live.innerHTML);
                            printMotifs.add(printed.innerHTML);
                        }
                    }
                    expect(liveMotifs.size === 4 && printMotifs.size === 4, "Changing margin style reused the previous artwork.");
                }
            } finally {
                desk.destroy(); deskRoot.remove(); printRoot.remove();
            }
            const rows = Array.from({length: 60}, (_, i) => "Entry " + (i + 1));
            editor.load({...sealed, text: ["# Journal", ...rows].join("\n"),
                formatting: [{location: 10, length: 5, emphasis: 2}]});
            const copy = editor.printContent();
            expect(copy.querySelector(".ink-block-heading")?.textContent === "Journal", "The PDF lost its rendered heading.");
            expect([...copy.querySelectorAll(".ink-line")].map(line => line.textContent).join("\n") === ["Journal", ...rows].join("\n"),
                "The printed letter omitted or reordered writing outside the viewport.");
            const wax = copy.querySelector(".ink-seal");
            expect(copy.querySelector(".ink-italic") && wax?.textContent === sealed.seal.text &&
                wax.dataset.color === sealed.seal.color && wax.dataset.shape === sealed.seal.shape,
                "The printed letter lost its styling or custom seal.");
        }
        const spaces = "\t\u0085\u00a0";
        const legacy = {...sealed, text:spaces, formatting:[]};
        editor.load(legacy);
        expect(mark.hidden && !editor.snapshot().seal, "Reopened a seal on a blank legacy letter.");
        expect(exportPlainText(legacy) === spaces && exportMarkdown(legacy) === spaces &&
            !importMarkdown(footer).seal, "Export or import retained a seal without a letter.");

        editor.load(sealed);
        editor.focus();
        getSelection().selectAllChildren(editor.element);
        input("insertReplacementText", "A revised closing.");
        expect(edits.at(-1).seal?.text === sealed.seal.text && !mark.hidden, "Replacing the writing removed its seal.");
        getSelection().selectAllChildren(editor.element);
        input("deleteContentBackward");
        expect(mark.hidden && !edits.at(-1).seal && edits.at(-1).text === "", "Clearing the writing kept a displayed or saved seal.");
        editor.command("undo");
        expect(!mark.hidden && edits.at(-1).seal?.text === sealed.seal.text && edits.at(-1).text === "A revised closing.",
            "Undo did not restore the closing and seal together.");
        editor.command("redo");
        expect(mark.hidden && !edits.at(-1).seal, "Redo left a seal over the empty page.");
        editor.command("undo");
        editor.setSeal({...sealed.seal, text:"New stamp"});
        editor.command("undo");
        expect(edits.at(-1).seal?.text === "New stamp", "Undoing a separate text edit reverted the chosen seal.");
        getSelection().selectAllChildren(editor.element);
        editor.element.dispatchEvent(new CompositionEvent("compositionstart"));
        editor.element.dispatchEvent(new CompositionEvent("compositionend", {data:""}));
        expect(!mark.hidden && editor.snapshot().seal?.text === "New stamp", "Canceling composition removed the seal.");
        getSelection().selectAllChildren(editor.element);
        editor.element.dispatchEvent(new CompositionEvent("compositionstart"));
        editor.element.dispatchEvent(new CompositionEvent("compositionend", {data:spaces}));
        expect(mark.hidden && !edits.at(-1).seal && /^\p{White_Space}+$/u.test(edits.at(-1).text),
            "Committing a whitespace-only replacement retained the seal.");
    }

    function input(inputType, data) {
        editor.element.dispatchEvent(new InputEvent("beforeinput", {inputType, data, bubbles: true, cancelable: true}));
    }
    function readStrokes() { return strokes.splice(0).join(" "); }
    function loadAtEnd(text) {
        editor.load({text});
        editor.focus();
        const caret = document.createRange();
        caret.selectNodeContents(editor.element);
        caret.collapse(false);
        getSelection().removeAllRanges();
        getSelection().addRange(caret);
    }
    for (const [paperMotion, width, size, wornInk] of [["sheet", 472, 18, false], ["roll", 621, 21, true]]) {
        surface.style.width = width + "px";
        editor.applySettings({paperMotion, writingFont: "menlo", fontSize: size, wornInk});
        loadAtEnd("");
        readStrokes();
        const bells = [], returns = [];
        for (let column = 1; column < 150 && returns.length < 2; column++) {
            input("insertText", "m");
            const events = readStrokes();
            if (events === "key bell") bells.push(column);
            else if (events === "key carriage") returns.push(column);
            else expect(events === "key", paperMotion + " unexpected typing events: " + events);
        }
        expect(returns.length === 2 && bells.length === 2 && bells.every((column, i) => column + 8 === returns[i]),
            paperMotion + " expected one bell with seven cells remaining on each row. Bells " + bells + ", returns " + returns);
        const justBefore = "m".repeat(bells[0] - 1);
        loadAtEnd(justBefore);
        input("insertText", " ");
        expect(readStrokes() === "space bell", "Space did not ring at the margin.");
        input("deleteContentBackward");
        expect(readStrokes() === "erase", "Backspace rang the bell.");
        input("insertText", "m");
        expect(readStrokes() === "key bell", "Typing across the warning point again did not re-arm the bell.");
        input("insertParagraph");
        expect(readStrokes() === "carriage", "Return should have its own sound.");
        loadAtEnd("Short");
        input("insertParagraph");
        expect(readStrokes() === "carriage", "Returning early should only play the carriage.");
        loadAtEnd(justBefore);
        editor.element.dispatchEvent(new KeyboardEvent("keydown", {key: "Tab", bubbles: true, cancelable: true}));
        expect(readStrokes() === "key bell", "Tab crossed the margin without warning.");
        loadAtEnd(justBefore);
        input("insertReplacementText", "more");
        editor.command("undo");
        expect(!readStrokes().includes("bell"), "Replacement or undo rang the bell.");
        loadAtEnd(justBefore);
        const clipboard = new DataTransfer();
        clipboard.setData("text/plain", "m");
        editor.element.dispatchEvent(new ClipboardEvent("paste", {clipboardData: clipboard, cancelable: true}));
        expect(!readStrokes(), "A paste at the warning point played a sound.");
        loadAtEnd(justBefore);
        editor.element.dispatchEvent(new CompositionEvent("compositionstart", {bubbles: true}));
        expect(!readStrokes(), "A provisional composition rang the bell.");
        editor.element.dispatchEvent(new CompositionEvent("compositionend", {data: "m", bubbles: true}));
        expect(readStrokes() === "key bell", "A committed composition missed the margin bell.");
        getSelection().modify("extend", "backward", "character");
        editor.element.dispatchEvent(new CompositionEvent("compositionstart", {bubbles: true}));
        editor.element.dispatchEvent(new CompositionEvent("compositionend", {data: "m", bubbles: true}));
        expect(readStrokes() === "key", "Replacing selected text by composition rang the margin bell.");
        loadAtEnd("m".repeat(returns[0] - 1));
        editor.element.dispatchEvent(new CompositionEvent("compositionstart", {bubbles: true}));
        editor.element.dispatchEvent(new CompositionEvent("compositionend", {data: "m", bubbles: true}));
        expect(readStrokes() === "key carriage", "A committed composition that wraps missed the carriage.");
    }
    // Let Chromium lay out eight extra digit cells. The first insertion for
    // which they wrap gives an independent reference for proportional/bidi text.
    editor.applySettings({paperMotion: "sheet", writingFont: "georgia", fontSize: 20, wornInk: false});
    function rowHeight(text) {
        editor.load({text});
        return editor.element.firstElementChild.offsetHeight;
    }
    for (const [prefix, letter] of [["", "i"], ["", "W"], ["a", "א"], ["א", "m"], ["# ", "m"], ["> ", "m"], ["- ", "m"]]) {
        const firstRow = rowHeight(prefix + letter);
        let text = prefix;
        while (rowHeight(text + letter + "00000000") === firstRow && text.length < 200) text += letter;
        expect(text.length < 200, "Could not locate the margin in proportional text.");
        loadAtEnd(text);
        input("insertText", letter);
        expect(readStrokes() === "key bell", "Missed proportional or bidirectional warning for " + text + letter);
    }
    const machines = ["classic", "soft", "royal", "vintage", "portable", "electric"];
    expect(choices.typewriterSound.map(machine => machine.id).join() === machines.join(), "Unexpected sound choices.");
    const keys = new Keys(), samples = [];
    keys.sound = (name, settings) => samples.push(new URL(sampleURL(settings.typewriterSound, name)).pathname.split("/").pop());
    for (const [saved, machine] of [...machines.map(id => [id, id]), ["office", "royal"], ["crisp", "vintage"], ["unknown", "classic"]]) {
        const settings = normalizeSettings({typewriterSound: saved, soundEnabled: false, soundVolume: 0.42, nightMode: true});
        expect(settings.typewriterSound === machine && !settings.soundEnabled && settings.soundVolume === 0.42 && settings.nightMode,
            "Settings migration changed a preference for " + saved);
        const prefix = machine === "classic" ? "" : machine + "-";
        for (const kind of ["key", "space", "carriage", "erase", "bell"]) keys.play(kind, {...settings, soundEnabled: true});
        const [key, ...actions] = samples.splice(0);
        expect([1, 2, 3].some(n => key === prefix + "key-" + n + ".wav"), "Incorrect key bank for " + saved);
        expect(actions.join() === ["space", "return", "erase", "bell"].map(action => prefix + action + ".wav").join(),
            "Incorrect action bank for " + saved);
        expect(sampleURL(saved, "bell") === sampleURL(machine, "bell"), "Legacy sample lookup failed for " + saved);
    }
    result.textContent = "PASS";
} catch (error) {
    result.textContent = "FAIL " + error.stack;
} finally {
    console.info("INKRAIL_EDITOR_RESULT " + result.textContent.replace(/\s*\n\s*/g, " "));
}
</script>
